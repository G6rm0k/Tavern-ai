name: Build iOS (unsigned, AltStore/SideStore)

# Produces a sideloadable .ipa with zero Apple Developer Program membership:
# code signing is fully disabled at the xcodebuild level, and AltStore/
# SideStore do their own signing at install time using the user's free
# Apple ID. There is nothing here that touches App Store Connect, TestFlight,
# or a paid account — deliberately, per the project's distribution model.
on:
  push:
    branches: [main, claude/**]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # The available Xcode/SDK version on hosted runners moves over time and
      # directly gates whether the tab bar gets the iOS 26 Liquid Glass look
      # (an SDK-linkage effect, not an opt-in API — see CLAUDE.md). Print what
      # is actually installed instead of assuming, so a version mismatch shows
      # up here rather than as a confusing failure three steps later.
      - name: Show available Xcode versions
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun simctl list devices available | grep -i "iPhone 1" || true

      # macos-15 runners ship several Xcode versions side by side; the
      # default selected one lags behind. Pin to Xcode 26 explicitly so the
      # app links against the iOS 26 SDK and picks up Liquid Glass — without
      # this, a plain, uncustomized TabView still renders as the flat,
      # pre-26 bar even on a device that itself runs iOS 26.
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Reverted an earlier attempt at this that explicitly `simctl boot`ed +
      # `bootstatus -b`'d ahead of time: on this runner that hung outright
      # (56+ minutes, no progress) rather than just being slow — apparently
      # `bootstatus` can wait forever for a state headless CI never reaches
      # without Simulator.app itself attached. `xcodebuild test` booting the
      # simulator implicitly is bounded by its own timeout-and-retry instead:
      # the occasional crash on the very first test-host launch of a run is a
      # known, self-recovering cost (xcodebuild retries automatically), not
      # an indefinite hang like the explicit-boot approach turned out to be.
      #
      # That self-recovery is real but was landing on the wrong suite: logs
      # from a run with 4 mid-test-host restarts showed AppLockControllerTests
      # and BackupCodecTests crash mid-test with no logic problem of their own
      # (their own tests pass cleanly on the next attempt), and
      # CharacterWizardControllerTests — the first suite to run immediately
      # after one of those restarts — got 10 failures whose *pattern* only
      # makes sense as inherited transient state right after a restart (a
      # value read as nil that the very next actor hop, milliseconds later,
      # reads back correctly). None of that is a code bug to chase further;
      # `-retry-tests-on-failure` is xcodebuild's own supported mechanism for
      # exactly this — it re-runs only the tests that failed, in a fresh
      # attempt, before deciding the run failed for real.
      - name: Run unit tests
        timeout-minutes: 20
        run: |
          xcodebuild test \
            -project wesaid.xcodeproj \
            -scheme wesaid \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project wesaid.xcodeproj \
            -scheme wesaid \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/wesaid.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      # AltStore/SideStore expect the classic .ipa layout: a zip whose only
      # top-level entry is Payload/<AppName>.app. They sign it themselves on
      # install — no provisioning profile or certificate belongs in this repo.
      - name: Package as .ipa
        run: |
          set -e
          cd build/wesaid.xcarchive/Products/Applications
          mkdir Payload
          mv wesaid.app Payload/
          zip -r ../../../wesaid.ipa Payload
          cd ../../../..
          ls -la build/

      - uses: actions/upload-artifact@v4
        with:
          name: wesaid-ipa
          path: ios/build/wesaid.ipa
          retention-days: 30
